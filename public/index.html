<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEADERBOARD PROJECT</title>
</head>
<body>
    <marquee scrollamount="15"  behavior="rotate" direction="left">&coloneq;you are highly welcome to codegisoft accedemy &copy;2025</marquee>
<section class="general_container">
    <div class="time-date">
        <marquee scrollamount="10" behavior="" direction=""><h1 id="time"></h1></marquee>
    </div>
    <p id="input"></p>
    <main class="leader-container">
        <div class="heading">
            <h2>Leaderboard</h2>
        </div>
        <div class="container">
            <div class="container_one">
                <div class="sub_heading">
                    <h2>Recent Scores</h2>
                    <button class="button" id="refresh-Btn" type="button">Refresh</button>
                </div>
                <div class="scores-list">
                    <ul class="scoresList">
                       
                       
                    </ul>
                </div>
            </div>
            <div class="scores-form">
                <h2>Add your score</h2>
                <form class="input_contain" id="score-form">
                    <input id="input-name" type="text" name="name" id="" placeholder="Your name" required="required">
                    <input id="input-score" type="number" name="name" id="" placeholder="Your Score" required="required">
                    <button id="submit-btn" type="submit">Submit</button>
                </form>
    
            </div>
        </div>
    </main>

</section>

</body>
</html>
